<!DOCTYPE html>
<html>
  <head>
    <title>Rock-Paper-Scissors</title>

    <style>
      body {
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;

        margin: 0;
        min-height: 100vh;
      }

      .game-title {
        font-size: 32px;
        margin-top: 50px;
        margin-bottom: 30px;
        color: rgb(236, 236, 193);
      }

      .moves {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
      }

      .move-button {
        background-color: transparent;
        border: 2px solid white;
        border-radius: 50%;
        width: 130px;
        height: 130px;
        cursor: pointer;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .move-button:hover {
        background-color: #222;
      }

      .game-image {
        width: 80px;
        height: 80px;
        object-fit: contain;
      }

      .js-result {
        font-size: 24px;
        margin-top: 40px;
      }

      .js-move {
        font-size: 18px;
      }

      .js-score {
        font-size: 18px;
        margin-bottom: 30px;
      }

      .reset-button {
        background-color: white;
        color: black;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .reset-button:hover {
        background-color: #cccccc;
      }
    .js-reset-message {
    font-size: 16px;
    margin-top: 15px;
    }
    </style>
  </head>

  <body>

    <p class="game-title">Rock Paper Scissors</p>

    <div class="moves">

      <button class="move-button" onclick="play('Rock')">
        <img
          class="game-image"
          src="pictures/stone.png"
          alt="Rock"
        >
      </button>

      <button class="move-button" onclick="play('Paper')">
        <img
          class="game-image"
          src="pictures/paper.png"
          alt="Paper"
        >
      </button>

      <button class="move-button" onclick="play('Scissors')">
        <img
          class="game-image"
          src="pictures/scissors.png"
          alt="Scissors"
        >
      </button>

    </div>

    <p class="js-result"></p>

    <p class="js-move"></p>

    <p class="js-score"></p>

    <button
      class="reset-button"
      onclick="
        counts.wins = 0;
        counts.losses = 0;
        counts.draws = 0;
        counts.games = 0;

        localStorage.setItem('score', JSON.stringify(counts));
        document.querySelector('.js-reset-message').innerHTML =
        'Score reset!';

        updateScoreElement();
      "
    >
      Reset Score
    </button>
    <p class="js-reset-message"></p>


    <script>

      function pickComputerMove() {

        var computer = '';
        var randomNumber = Math.random();

        if (randomNumber <= 0.33) {
          computer = 'Rock';
        }
        else if (randomNumber < 0.66) {
          computer = 'Paper';
        }
        else {
          computer = 'Scissors';
        }

        return computer;
      }


      var beats = {
        Rock: 'Scissors',
        Paper: 'Rock',
        Scissors: 'Paper'
      };


      function getResult(player, computer) {

        if (player === computer) {
          return 'draw';
        }
        else if (beats[player] === computer) {
          return 'win';
        }
        else {
          return 'lose';
        }
      }


      function play(player) {
            document.querySelector('.js-reset-message').innerHTML = '';

        var computer = pickComputerMove();

        var result = getResult(player, computer);

        counts.games++;

        message(result, computer);
      }


      const savedScore = localStorage.getItem('score');


      const counts = savedScore
        ? JSON.parse(savedScore)
        : {
            wins: 0,
            losses: 0,
            draws: 0,
            games: 0
          };


      updateScoreElement();


      function message(result, computer) {

        if (result === 'draw') {
          counts.draws++;
        }
        else if (result === 'win') {
          counts.wins++;
        }
        else {
          counts.losses++;
        }


        localStorage.setItem(
          'score',
          JSON.stringify(counts)
        );


        document.querySelector('.js-result').innerHTML =
          `You ${result}!`;


        document.querySelector('.js-move').innerHTML =
          `Computer played '${computer}'`;


        updateScoreElement();
      }


      function updateScoreElement() {

        document.querySelector('.js-score').innerHTML =
          `Wins: ${counts.wins} &nbsp;&nbsp;
           Losses: ${counts.losses} &nbsp;&nbsp;
           Draws: ${counts.draws} &nbsp;&nbsp;
           Games: ${counts.games}`;
      }

    </script>

  </body>
</html>
